CLAUDE BUILD CONTRACT – COSTSHIELD V1

PROJECT CONTEXT

You are building CostShield v1.

CostShield v1 provides: - Application-level API cost visibility -
Project-level budgets - Warning & critical alerts - Basic dashboard with
light visualizations

It is NOT: - An enforcement/blocking system - Enterprise governance
software - Feature-level or per-user budget enforcement - A complex
analytics platform

Strict scope control is mandatory.

TECH STACK (LOCKED)

-   Backend: Node.js + Express
-   Language: TypeScript (strict mode enabled)
-   Database: PostgreSQL
-   ORM: Sequelize
-   Frontend: React + Vite
-   UI: shadcn + Tailwind
-   Email: Resend (transactional only — warning + critical alerts)
-   Monorepo structure

Do NOT suggest switching stack.

TYPESCRIPT GUIDELINES

1.  Enable strict mode in tsconfig.
2.  No use of any unless absolutely unavoidable.
3.  Define explicit interfaces for:
    -   Track request payload
    -   Budget evaluation result
    -   Alert result
    -   API responses
4.  Keep types in a shared types folder (packages/shared).
5.  Avoid over-generic abstractions.
6.  Prefer clear explicit types over clever generics.
7.  Use enums where appropriate (status types).
8.  Avoid type duplication across modules.

PROJECT STRUCTURE (HIGH LEVEL)

packages/ api/ src/ app.ts server.ts modules/ auth/ projects/ tracking/
budgets/ alerts/ billing/ middlewares/ utils/ config/ migrations/
models/ dashboard/ src/ pages/ components/ hooks/ sdk/ src/ shared/
types/ enums/ constants/

Keep modules cohesive and simple. No domain-driven architecture layers.
No unnecessary service layers.

FINANCIAL RULES (NON-NEGOTIABLE)

-   Store money as bigint (smallest currency unit).
-   Never use floats for storage.
-   Currency conversion only at display layer.
-   No mixed currency logic in tracking layer.

SDK RULES

-   Fire-and-forget tracking.
-   Never block application.
-   Never throw runtime errors in production.
-   Retry once, then fail silently.
-   Only cost metadata sent.

AUTH RULES (V1)

-   GitHub OAuth — primary.
-   Google OAuth — secondary.
-   JWT-based session management (24-hour expiry).
-   Email + password is Phase 2. Do NOT implement in v1.
-   No password storage in v1. No bcrypt. No password reset flows.

BILLING RULES (V1)

-   Plan table and subscription table exist in DB and are used.
-   All users start on Free plan automatically on signup.
-   Plan limits (request_limit, project_limit) are actively enforced.
-   No live payment gateway integration in v1.
-   Upgrade button = "Coming Soon" or waitlist capture.
-   Razorpay integration is Phase 1.5 (after first 10–20 real users).
-   Do NOT add Razorpay or Stripe in v1.

PROJECT OWNERSHIP (V1)

-   Projects are single-owner only.
-   No invites. No shared access. No RBAC per project.
-   Each project belongs to exactly one user.
-   Team collaboration is Phase 3. Do NOT build it in v1.

V1 FEATURE SCOPE (ALLOWED)

-   Track cost events.
-   Daily cost aggregation.
-   Warning & critical alerts.
-   Basic dashboard numbers.
-   Top 5 features.
-   Top 5 users.
-   Project-level budgets.
-   Light visualizations:
    -   Simple line chart (daily trend)
    -   Small comparison chart (today vs yesterday)
-   Filters:
    -   Date filter (Today, 7 days, 30 days)
    -   Project filter (multi-project switcher)

V1 FEATURES (NOT ALLOWED)

-   Email/password auth
-   Live payment processing (Razorpay/Stripe)
-   Per-user budgets
-   Per-feature budgets
-   Automatic blocking
-   Slack alerts
-   Webhooks
-   Advanced anomaly detection
-   Team collaboration
-   Complex analytics engine

ALERT LOGIC

-   Warning fires once per project per day.
-   Critical fires once per project per day.
-   Reset at 00:00 UTC.
-   No duplicate alerts.
-   Keep logic simple and deterministic.
-   Delivery via Resend (transactional email only).

/TRACK ENDPOINT RULES

-   Validate API key.
-   Insert cost_event.
-   Upsert daily_cost.
-   Evaluate thresholds.
-   Trigger alert if crossed.
-   Return minimal response.
-   No background job systems in v1.
-   Keep transactional and atomic.

UI GUIDELINES

-   Clean, professional, developer-focused.
-   Numbers first, charts secondary.
-   3 stat cards on top.
-   Light line chart for spike comparison.
-   Top 5 features & users.
-   Clear budget status badge (Green / Amber / Red).
-   No over-visualization.
-   No heavy analytics dashboards.

WHEN UNSURE

Default to simpler implementation. Do not introduce abstraction unless
absolutely necessary. Ask before adding complexity.

DEVELOPMENT ORDER (MANDATORY)

1.  DB schema + Sequelize models.
2.  /api/v1/track endpoint.
3.  Budget threshold logic.
4.  Alert logic (Resend).
5.  Auth (GitHub OAuth + Google OAuth).
6.  Project CRUD (single-owner).
7.  Dashboard.
8.  Billing UI (plan display only — no payment gateway).

Ship working core before polishing UI.

